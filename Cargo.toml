[package]
name = "clicknfocus-osx"
version = "0.1.0"
edition = "2024"
description = "Eager click-to-focus for macOS"
license = "MIT"
repository = "https://github.com/bretheskevin/clicknfocus-osx"
readme = "README.md"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
core-graphics = "0.25"
core-foundation = "0.10"
accessibility-sys = "0.2"
libc = "0.2"
objc = "0.2"
