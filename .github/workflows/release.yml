name: release

# Every push to main builds the Intel and Apple Silicon zips and publishes
# them to a single versioned release. The version is read from Cargo.toml —
# bump it to cut a new release; pushes without a bump refresh the current
# release's assets in place.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Read version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build Intel zip
        run: ./build-app.sh intel

      - name: Build Apple Silicon zip
        run: ./build-app.sh apple

      - name: Publish release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            dist/clicknfocus-macos-intel.zip
            dist/clicknfocus-macos-apple-silicon.zip
          body: |
            Eager click-to-focus for macOS — v${{ steps.version.outputs.version }}.

            ## Install (no Rust needed)

            1. Download the zip for your Mac and unzip it:
               - **Apple Silicon** (M1/M2/M3…): `clicknfocus-macos-apple-silicon.zip`
               - **Intel**: `clicknfocus-macos-intel.zip`
            2. Run the installer:
               ```sh
               ./install.sh
               ```
            3. Enable **ClicknFocus** in System Settings → Privacy & Security → Accessibility.

            macOS 11+. Ad-hoc signed (not notarized).
