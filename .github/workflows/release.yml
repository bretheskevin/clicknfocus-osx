name: release

# Releases are cut by pushing a version tag (e.g. `git tag v1.1.0 && git push
# --tags`). Each tag builds the Intel and Apple Silicon zips and publishes them
# to its own release, so the tag, the source it points at, and the binaries
# always match. Pushes to main no longer touch releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version. Bump Cargo.toml or retag."
            exit 1
          fi

      - name: Build Intel zip
        run: ./build-app.sh intel

      - name: Build Apple Silicon zip
        run: ./build-app.sh apple

      - name: Publish release ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/clicknfocus-macos-intel.zip
            dist/clicknfocus-macos-apple-silicon.zip
          body: |
            Eager click-to-focus for macOS — ${{ github.ref_name }}.

            ## Install (no Rust needed)

            1. Download the zip for your Mac and unzip it:
               - **Apple Silicon** (M1/M2/M3…): `clicknfocus-macos-apple-silicon.zip`
               - **Intel**: `clicknfocus-macos-intel.zip`
            2. Run the installer:
               ```sh
               ./install.sh
               ```
            3. Enable **ClicknFocus** in System Settings → Privacy & Security → Accessibility.

            macOS 11+. Ad-hoc signed (not notarized).
